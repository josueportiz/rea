name: Sync upstream

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream
          
          # Detect the default branch (usually main or master)
          DEFAULT_BRANCH=$(git remote show upstream | sed -n '/HEAD branch/s/.*: //p')
          
          git checkout $DEFAULT_BRANCH
          git merge --ff-only upstream/$DEFAULT_BRANCH
          git push origin $DEFAULT_BRANCH
